<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بطاقة العضوية - Carte de membre</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="/js/utils.js"></script>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(-45deg, #f0fdf4, #dcfce7, #ecfdf5, #ffffff);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        .font-inter {
            font-family: 'Inter', sans-serif;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }

        .glass-header {
            background: linear-gradient(135deg, rgba(6, 95, 70, 0.95) 0%, rgba(16, 185, 129, 0.9) 100%);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <a href="/"
        class="fixed top-4 left-4 bg-white/40 hover:bg-white/60 backdrop-blur-md text-gray-800 font-bold py-2 px-4 rounded-xl shadow-md transition duration-300 flex items-center gap-2 text-sm z-50 border border-white/50">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18">
            </path>
        </svg>
        <span class="font-inter">Retour / العودة</span>
    </a>

    <div class="glass-card rounded-3xl w-full max-w-lg overflow-hidden relative border-t-4 border-teal-500 shadow-2xl">

        <div class="glass-header p-6 text-center relative overflow-hidden text-white">
            <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-10">
            </div>
            <h1 class="text-3xl font-extrabold drop-shadow-md">بطاقة العضوية</h1>
            <p class="text-green-100 text-sm mt-1 font-inter opacity-90 tracking-wide">Carte de membre — Vérification</p>
        </div>

        <div class="p-8 bg-white/40">
            <form id="carteForm" class="space-y-5 text-right">
                <div>
                    <label for="carteToken" class="block text-sm font-bold text-gray-700 mb-2">
                        رمز البطاقة / Jeton (Token) <span class="text-red-500">*</span>
                    </label>
                    <input id="carteToken" type="text" required minlength="64" maxlength="64" pattern="[0-9a-fA-F]{64}"
                        dir="ltr" autocomplete="off" spellcheck="false"
                        placeholder="0000...0000"
                        class="w-full px-4 py-3 rounded-xl border border-gray-300 bg-white text-gray-800 font-inter text-left text-sm focus:ring-2 focus:ring-teal-500 outline-none">
                    <p class="text-xs text-gray-500 mt-2 font-inter">64 caractères hexadécimaux / 64 caractères hex</p>
                </div>
                <button id="verifyBtn" type="submit"
                    class="w-full bg-gradient-to-r from-teal-500 to-emerald-600 hover:from-teal-600 hover:to-emerald-700 text-white font-bold py-3 px-8 rounded-xl transition duration-300 shadow-md hover:shadow-lg">
                    Vérifier / تحقق
                </button>
            </form>

            <div id="carteResult" class="hidden mt-6 rounded-2xl border border-teal-200 bg-white/90 p-6 shadow-inner"
                role="status"></div>
        </div>

        <div class="bg-gray-100/80 p-4 text-center text-xs text-gray-500 border-t border-gray-200/50 font-inter">
            Mauritanie © 2026 - Assoc. Jeunesse
        </div>
    </div>

    <script>
        function apiMessage(data, fallback) {
            if (data && data.message) return String(data.message);
            if (data && Array.isArray(data.errors) && data.errors.length > 0) return data.errors.join(', ');
            return fallback;
        }

        const form = document.getElementById('carteForm');
        const tokenInput = document.getElementById('carteToken');
        const verifyBtn = document.getElementById('verifyBtn');
        const result = document.getElementById('carteResult');
        const tokenParam = new URLSearchParams(window.location.search).get('token');
        if (tokenParam) tokenInput.value = tokenParam;

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const token = tokenInput.value.trim();
            result.classList.add('hidden');
            verifyBtn.disabled = true;

            try {
                const response = await fetch('/api/carte/' + encodeURIComponent(token));
                const data = await response.json().catch(() => ({}));

                if (response.status === 404) {
                    throw new Error('Carte introuvable / البطاقة غير موجودة');
                }
                if (!response.ok || !data) {
                    throw new Error(apiMessage(data, 'Erreur lors de la vérification / خطأ أثناء التحقق'));
                }

                const statuts = {
                    valide: 'Valide / صالح',
                    inactif: 'Inactif / غير نشط',
                    expire: 'Expirée / منتهية'
                };
                const safeToken = encodeURIComponent(token);
                result.innerHTML = `
                    <div class="space-y-3 text-sm">
                        <div class="flex justify-between gap-4 border-b border-gray-100 pb-2">
                            <span class="font-bold text-gray-600">الاسم / Nom</span>
                            <span class="font-extrabold text-gray-800">${escapeHtml(data.nom)}</span>
                        </div>
                        <div class="flex justify-between gap-4 border-b border-gray-100 pb-2">
                            <span class="font-bold text-gray-600">رقم العضوية / N° adhérent</span>
                            <span class="font-inter font-bold text-teal-700" dir="ltr">${escapeHtml(data.numero_adherent)}</span>
                        </div>
                        <div class="flex justify-between gap-4 border-b border-gray-100 pb-2">
                            <span class="font-bold text-gray-600">الحالة / Statut</span>
                            <span class="font-bold ${data.statut === 'valide' ? 'text-green-600' : 'text-red-600'}">${escapeHtml(statuts[data.statut] || data.statut)}</span>
                        </div>
                        <div class="flex justify-between gap-4 border-b border-gray-100 pb-2">
                            <span class="font-bold text-gray-600">تنتهي في / Expiration</span>
                            <span class="font-inter font-bold text-gray-800" dir="ltr">${escapeHtml(data.expire_le || '—')}</span>
                        </div>
                        <div class="flex justify-between gap-4">
                            <span class="font-bold text-gray-600">السنة / Année</span>
                            <span class="font-inter font-bold text-gray-800" dir="ltr">${escapeHtml(data.annee)}</span>
                        </div>
                    </div>
                    <a href="/api/carte/${escapeHtml(safeToken)}.pdf" target="_blank" rel="noopener noreferrer"
                        class="mt-6 inline-block w-full text-center bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white font-bold py-3 px-6 rounded-xl transition duration-300 shadow-md">
                        Télécharger la carte PDF / تحميل البطاقة
                    </a>
                `;
                result.classList.remove('hidden');
            } catch (error) {
                result.innerHTML = `<p class="text-center font-bold text-red-600">${escapeHtml(error.message || 'Erreur réseau / خطأ في الشبكة')}</p>`;
                result.classList.remove('hidden');
            } finally {
                verifyBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
