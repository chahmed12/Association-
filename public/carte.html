<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بطاقة العضوية - Carte de membre</title>
    <link href="/css/app.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="/js/utils.js"></script>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(-45deg, #f0fdf4, #dcfce7, #ecfdf5, #ffffff);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        .font-inter {
            font-family: 'Inter', sans-serif;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }

        .glass-header {
            background: linear-gradient(135deg, rgba(6, 95, 70, 0.95) 0%, rgba(16, 185, 129, 0.9) 100%);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Palette AJJ unifiée */
        :root { --ajj-emerald: #087f5b; --ajj-deep: #062c2a; --ajj-gold: #d8aa55; --ajj-sand: #e9d7b4; }
        [class*="text-ajj-emerald"] { color: var(--ajj-emerald) !important; }
        [class*="text-ajj-deep"] { color: var(--ajj-deep) !important; }
        [class*="text-ajj-gold"] { color: var(--ajj-gold) !important; }
        [class*="text-ajj-sand"] { color: var(--ajj-sand) !important; }
        [class*="text-green-"], [class*="text-emerald-"], [class*="text-teal-"],
        [class*="text-cyan-"], [class*="text-blue-"], [class*="text-indigo-"],
        [class*="text-purple-"], [class*="text-violet-"], [class*="text-fuchsia-"],
        [class*="text-amber-"], [class*="text-yellow-"], [class*="text-orange-"],
        [class*="text-pink-"], [class*="text-rose-"] { color: var(--ajj-emerald) !important; }
        [class*="text-green-50"], [class*="text-emerald-50"],
        [class*="text-amber-50"], [class*="text-yellow-50"] { color: var(--ajj-sand) !important; }
        [class*="text-gray-"], [class*="text-slate-"] { color: #425a52 !important; }
        [class*="bg-green-"], [class*="bg-emerald-"], [class*="bg-teal-"],
        [class*="bg-cyan-"], [class*="bg-blue-"], [class*="bg-indigo-"],
        [class*="bg-purple-"], [class*="bg-violet-"], [class*="bg-fuchsia-"] { background-color: var(--ajj-emerald) !important; }
        [class*="bg-amber-"], [class*="bg-yellow-"], [class*="bg-orange-"],
        [class*="bg-pink-"], [class*="bg-rose-"] { background-color: var(--ajj-gold) !important; }
        [class*="bg-green-50"], [class*="bg-emerald-50"], [class*="bg-teal-50"],
        [class*="bg-blue-50"], [class*="bg-indigo-50"], [class*="bg-purple-50"],
        [class*="bg-pink-50"], [class*="bg-rose-50"], [class*="bg-amber-50"],
        [class*="bg-yellow-50"] { background-color: rgba(8,127,91,.09) !important; }
        [class*="bg-gray-100"], [class*="bg-gray-200"], [class*="bg-gray-50"],
        [class*="bg-slate-100"], [class*="bg-slate-200"], [class*="bg-slate-50"] { background-color: #f7f2e8 !important; }
        [class*="bg-gray-800"], [class*="bg-gray-900"],
        [class*="bg-slate-800"], [class*="bg-slate-900"] { background-color: var(--ajj-deep) !important; }
        [class*="border-green-"], [class*="border-emerald-"], [class*="border-teal-"],
        [class*="border-blue-"], [class*="border-indigo-"], [class*="border-amber-"],
        [class*="border-yellow-"] { border-color: var(--ajj-emerald) !important; }
        [class*="border-pink-"], [class*="border-purple-"], [class*="border-rose-"] { border-color: var(--ajj-gold) !important; }
        [class*="border-gray-"], [class*="border-slate-"] { border-color: rgba(6,44,42,.14) !important; }
        [class*="ring-green-"], [class*="ring-emerald-"], [class*="ring-teal-"],
        [class*="ring-blue-"], [class*="ring-purple-"], [class*="ring-pink-"] { --tw-ring-color: rgba(8,127,91,.25) !important; }
        [class*="from-green-"], [class*="from-emerald-"], [class*="from-teal-"],
        [class*="from-cyan-"], [class*="from-blue-"], [class*="from-indigo-"],
        [class*="from-purple-"], [class*="from-violet-"], [class*="from-fuchsia-"],
        [class*="from-pink-"], [class*="from-rose-"] { --tw-gradient-from: var(--ajj-emerald) var(--tw-gradient-from-position) !important; }
        [class*="from-amber-"], [class*="from-yellow-"], [class*="from-orange-"] { --tw-gradient-from: var(--ajj-gold) var(--tw-gradient-from-position) !important; }
        [class*="from-gray-"], [class*="from-slate-"] { --tw-gradient-from: var(--ajj-deep) var(--tw-gradient-from-position) !important; }
        [class*="to-green-"], [class*="to-emerald-"], [class*="to-teal-"],
        [class*="to-cyan-"], [class*="to-blue-"], [class*="to-indigo-"],
        [class*="to-purple-"], [class*="to-violet-"], [class*="to-fuchsia-"],
        [class*="to-pink-"], [class*="to-rose-"] { --tw-gradient-to: var(--ajj-emerald) var(--tw-gradient-to-position) !important; }
        [class*="to-amber-"], [class*="to-yellow-"], [class*="to-orange-"] { --tw-gradient-to: var(--ajj-gold) var(--tw-gradient-to-position) !important; }
        [class*="to-gray-"], [class*="to-slate-"] { --tw-gradient-to: var(--ajj-deep) var(--tw-gradient-to-position) !important; }
        [class*="via-green-"], [class*="via-emerald-"], [class*="via-yellow-"] { --tw-gradient-via: var(--ajj-emerald) var(--tw-gradient-via-position) !important; }
</style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <a href="/" class="ajj-back ajj-back--fixed" aria-label="العودة إلى الرئيسية / Retour à l'accueil">
        <svg class="ajj-back__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        <span>العودة إلى الرئيسية</span>
        <span class="ajj-back__fr" lang="fr">Retour à l'accueil</span>
    </a>

    <div class="glass-card rounded-3xl w-full max-w-lg overflow-hidden relative border-t-4 border-green-500 shadow-2xl">

        <div class="glass-header p-6 text-center relative overflow-hidden text-white">
            <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-10">
            </div>
            <h1 class="text-3xl font-extrabold drop-shadow-md">بطاقة العضوية</h1>
            <p class="text-green-100 text-sm mt-1 font-inter opacity-90 tracking-wide">Carte de membre — Vérification</p>
        </div>

        <div class="p-8 bg-white/40">
            <form id="carteForm" class="space-y-5 text-right">
                <div>
                    <label for="carteToken" class="block text-sm font-bold text-gray-700 mb-2">
                        رمز البطاقة / Jeton (Token) <span class="text-red-500">*</span>
                    </label>
                    <input id="carteToken" type="text" required minlength="64" maxlength="64" pattern="[0-9a-fA-F]{64}"
                        dir="ltr" autocomplete="off" spellcheck="false"
                        placeholder="0000...0000"
                        class="w-full px-4 py-3 rounded-xl border border-gray-300 bg-white text-gray-800 font-inter text-left text-sm focus:ring-2 focus:ring-green-500 outline-none">
                    <p class="text-xs text-gray-500 mt-2 font-inter">64 caractères hexadécimaux / 64 caractères hex</p>
                </div>
                <button id="verifyBtn" type="submit"
                    class="w-full bg-gradient-to-r from-amber-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white font-bold py-3 px-8 rounded-xl transition duration-300 shadow-md hover:shadow-lg">
                    Vérifier / تحقق
                </button>
            </form>

            <div id="carteResult" class="hidden mt-6 rounded-2xl border border-green-200 bg-white/90 p-6 shadow-inner"
                role="status"></div>

            <form id="cartePhotoForm"
                class="hidden mt-4 rounded-2xl border border-amber-200 bg-white/90 p-4 shadow-inner space-y-3 text-right">
                <label for="cartePhoto" class="block text-sm font-bold text-gray-700">
                    صورة العضو (اختيارية) / Photo (optionnelle)
                </label>
                <input id="cartePhoto" type="file" accept="image/jpeg,image/png,image/webp"
                    class="w-full text-xs text-gray-600 font-inter">
                <button id="cartePhotoBtn" type="submit"
                    class="w-full bg-gradient-to-r from-amber-500 to-emerald-600 text-white font-bold py-2.5 px-6 rounded-xl transition shadow-md">
                    Enregistrer la photo / حفظ الصورة
                </button>
                <p id="cartePhotoStatus" class="hidden text-xs font-bold text-center"></p>
            </form>
        </div>

        <div class="bg-gray-100/80 p-4 text-center text-xs text-gray-500 border-t border-gray-200/50 font-inter">
            Mauritanie © 2026 - Assoc. Jeunesse
        </div>
    </div>

    <script>
        function apiMessage(data, fallback) {
            if (data && data.message) return String(data.message);
            if (data && Array.isArray(data.errors) && data.errors.length > 0) return data.errors.join(', ');
            return fallback;
        }

        const form = document.getElementById('carteForm');
        const tokenInput = document.getElementById('carteToken');
        const verifyBtn = document.getElementById('verifyBtn');
        const result = document.getElementById('carteResult');
        const photoForm = document.getElementById('cartePhotoForm');
        const photoInput = document.getElementById('cartePhoto');
        const photoBtn = document.getElementById('cartePhotoBtn');
        const photoStatus = document.getElementById('cartePhotoStatus');
        let carteActiveToken = '';
        const tokenParam = new URLSearchParams(window.location.search).get('token');
        if (tokenParam) tokenInput.value = tokenParam;

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const token = tokenInput.value.trim();
            result.classList.add('hidden');
            verifyBtn.disabled = true;

            try {
                const response = await fetch('/api/carte/' + encodeURIComponent(token));
                const data = await response.json().catch(() => ({}));

                if (response.status === 404) {
                    throw new Error('Carte introuvable / البطاقة غير موجودة');
                }
                if (!response.ok || !data) {
                    throw new Error(apiMessage(data, 'Erreur lors de la vérification / خطأ أثناء التحقق'));
                }

                const statuts = {
                    valide: 'Valide / صالح',
                    inactif: 'Inactif / غير نشط',
                    expire: 'Expirée / منتهية'
                };
                const safeToken = encodeURIComponent(token);
                result.innerHTML = `
                    <div class="space-y-3 text-sm">
                        <div class="flex justify-between gap-4 border-b border-gray-100 pb-2">
                            <span class="font-bold text-gray-600">الاسم / Nom</span>
                            <span class="font-extrabold text-gray-800">${escapeHtml(data.nom)}</span>
                        </div>
                        <div class="flex justify-between gap-4 border-b border-gray-100 pb-2">
                            <span class="font-bold text-gray-600">رقم العضوية / N° adhérent</span>
                            <span class="font-inter font-bold text-green-700" dir="ltr">${escapeHtml(data.numero_adherent)}</span>
                        </div>
                        <div class="flex justify-between gap-4 border-b border-gray-100 pb-2">
                            <span class="font-bold text-gray-600">الحالة / Statut</span>
                            <span class="font-bold ${data.statut === 'valide' ? 'text-green-600' : 'text-red-600'}">${escapeHtml(statuts[data.statut] || data.statut)}</span>
                        </div>
                        <div class="flex justify-between gap-4 border-b border-gray-100 pb-2">
                            <span class="font-bold text-gray-600">تنتهي في / Expiration</span>
                            <span class="font-inter font-bold text-gray-800" dir="ltr">${escapeHtml(data.expire_le || '—')}</span>
                        </div>
                        <div class="flex justify-between gap-4">
                            <span class="font-bold text-gray-600">السنة / Année</span>
                            <span class="font-inter font-bold text-gray-800" dir="ltr">${escapeHtml(data.annee)}</span>
                        </div>
                    </div>
                    <a href="/api/carte/${escapeHtml(safeToken)}.pdf?v=2" target="_blank" rel="noopener noreferrer"
                        class="mt-6 inline-block w-full text-center bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white font-bold py-3 px-6 rounded-xl transition duration-300 shadow-md">
                        Télécharger la carte PDF / تحميل البطاقة
                    </a>
                `;
                carteActiveToken = token;
                photoInput.value = '';
                photoStatus.classList.add('hidden');
                photoForm.classList.remove('hidden');
                result.classList.remove('hidden');
            } catch (error) {
                result.innerHTML = `<p class="text-center font-bold text-red-600">${escapeHtml(error.message || 'Erreur réseau / خطأ في الشبكة')}</p>`;
                result.classList.remove('hidden');
            } finally {
                verifyBtn.disabled = false;
            }
        });

        photoForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const fichier = photoInput.files[0];
            if (!fichier || !carteActiveToken) return;
            photoBtn.disabled = true;
            photoStatus.classList.add('hidden');

            try {
                const donnees = new FormData();
                donnees.append('image', fichier);
                const response = await fetch(`/api/carte/${encodeURIComponent(carteActiveToken)}/photo`, {
                    method: 'POST',
                    body: donnees
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok || !data.success) {
                    throw new Error(apiMessage(data, 'Erreur lors de l’enregistrement / خطأ أثناء الحفظ'));
                }
                photoStatus.textContent = 'Photo enregistrée / تم حفظ الصورة';
                photoStatus.className = 'text-xs font-bold text-center text-green-600';
            } catch (error) {
                photoStatus.textContent = error.message || 'Erreur réseau / خطأ في الشبكة';
                photoStatus.className = 'text-xs font-bold text-center text-red-600';
            } finally {
                photoBtn.disabled = false;
                photoStatus.classList.remove('hidden');
            }
        });
    </script>
</body>

</html>
