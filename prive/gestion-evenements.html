<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Événements | رابطة شباب جدة</title>
    <link href="/css/app.css" rel="stylesheet">
    <script src="/js/utils.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(-45deg, #f0fdf4, #dcfce7, #ecfdf5, #ffffff);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .field {
            width: 100%;
            padding: 0.7rem 0.9rem;
            border: 1px solid #d1d5db;
            border-radius: 0.6rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .field:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
        }

        /* Palette AJJ unifiée */
        :root { --ajj-emerald: #087f5b; --ajj-deep: #062c2a; --ajj-gold: #d8aa55; --ajj-sand: #e9d7b4; }
        [class*="text-ajj-emerald"] { color: var(--ajj-emerald) !important; }
        [class*="text-ajj-deep"] { color: var(--ajj-deep) !important; }
        [class*="text-ajj-gold"] { color: var(--ajj-gold) !important; }
        [class*="text-ajj-sand"] { color: var(--ajj-sand) !important; }
        [class*="text-green-"], [class*="text-emerald-"], [class*="text-teal-"],
        [class*="text-cyan-"], [class*="text-blue-"], [class*="text-indigo-"],
        [class*="text-purple-"], [class*="text-violet-"], [class*="text-fuchsia-"],
        [class*="text-amber-"], [class*="text-yellow-"], [class*="text-orange-"],
        [class*="text-pink-"], [class*="text-rose-"] { color: var(--ajj-emerald) !important; }
        [class*="text-green-50"], [class*="text-emerald-50"],
        [class*="text-amber-50"], [class*="text-yellow-50"] { color: var(--ajj-sand) !important; }
        [class*="text-gray-"], [class*="text-slate-"] { color: #425a52 !important; }
        [class*="bg-green-"], [class*="bg-emerald-"], [class*="bg-teal-"],
        [class*="bg-cyan-"], [class*="bg-blue-"], [class*="bg-indigo-"],
        [class*="bg-purple-"], [class*="bg-violet-"], [class*="bg-fuchsia-"] { background-color: var(--ajj-emerald) !important; }
        [class*="bg-amber-"], [class*="bg-yellow-"], [class*="bg-orange-"],
        [class*="bg-pink-"], [class*="bg-rose-"] { background-color: var(--ajj-gold) !important; }
        [class*="bg-green-50"], [class*="bg-emerald-50"], [class*="bg-teal-50"],
        [class*="bg-blue-50"], [class*="bg-indigo-50"], [class*="bg-purple-50"],
        [class*="bg-pink-50"], [class*="bg-rose-50"], [class*="bg-amber-50"],
        [class*="bg-yellow-50"] { background-color: rgba(8,127,91,.09) !important; }
        [class*="bg-gray-100"], [class*="bg-gray-200"], [class*="bg-gray-50"],
        [class*="bg-slate-100"], [class*="bg-slate-200"], [class*="bg-slate-50"] { background-color: #f7f2e8 !important; }
        [class*="bg-gray-800"], [class*="bg-gray-900"],
        [class*="bg-slate-800"], [class*="bg-slate-900"] { background-color: var(--ajj-deep) !important; }
        [class*="border-green-"], [class*="border-emerald-"], [class*="border-teal-"],
        [class*="border-blue-"], [class*="border-indigo-"], [class*="border-amber-"],
        [class*="border-yellow-"] { border-color: var(--ajj-emerald) !important; }
        [class*="border-pink-"], [class*="border-purple-"], [class*="border-rose-"] { border-color: var(--ajj-gold) !important; }
        [class*="border-gray-"], [class*="border-slate-"] { border-color: rgba(6,44,42,.14) !important; }
        [class*="ring-green-"], [class*="ring-emerald-"], [class*="ring-teal-"],
        [class*="ring-blue-"], [class*="ring-purple-"], [class*="ring-pink-"] { --tw-ring-color: rgba(8,127,91,.25) !important; }
        [class*="from-green-"], [class*="from-emerald-"], [class*="from-teal-"],
        [class*="from-cyan-"], [class*="from-blue-"], [class*="from-indigo-"],
        [class*="from-purple-"], [class*="from-violet-"], [class*="from-fuchsia-"],
        [class*="from-pink-"], [class*="from-rose-"] { --tw-gradient-from: var(--ajj-emerald) var(--tw-gradient-from-position) !important; }
        [class*="from-amber-"], [class*="from-yellow-"], [class*="from-orange-"] { --tw-gradient-from: var(--ajj-gold) var(--tw-gradient-from-position) !important; }
        [class*="from-gray-"], [class*="from-slate-"] { --tw-gradient-from: var(--ajj-deep) var(--tw-gradient-from-position) !important; }
        [class*="to-green-"], [class*="to-emerald-"], [class*="to-teal-"],
        [class*="to-cyan-"], [class*="to-blue-"], [class*="to-indigo-"],
        [class*="to-purple-"], [class*="to-violet-"], [class*="to-fuchsia-"],
        [class*="to-pink-"], [class*="to-rose-"] { --tw-gradient-to: var(--ajj-emerald) var(--tw-gradient-to-position) !important; }
        [class*="to-amber-"], [class*="to-yellow-"], [class*="to-orange-"] { --tw-gradient-to: var(--ajj-gold) var(--tw-gradient-to-position) !important; }
        [class*="to-gray-"], [class*="to-slate-"] { --tw-gradient-to: var(--ajj-deep) var(--tw-gradient-to-position) !important; }
        [class*="via-green-"], [class*="via-emerald-"], [class*="via-yellow-"] { --tw-gradient-via: var(--ajj-emerald) var(--tw-gradient-via-position) !important; }
</style>
</head>

<body class="min-h-screen p-6 md:p-10 text-gray-800">
    <a href="/admin.html" class="ajj-back ajj-back--fixed" aria-label="العودة إلى لوحة التحكم / Retour au tableau de bord">
  <svg class="ajj-back__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
  <span>لوحة التحكم</span>
  <span class="ajj-back__fr" lang="fr">Retour Dashboard</span>
</a>
    <div class="max-w-6xl mx-auto">
        <div class="flex flex-wrap justify-between items-center mb-8 gap-4">
            <div>

                <h1 class="text-3xl font-extrabold mt-2">Agenda / Événements</h1>
                <p class="text-gray-600">إدارة الفعاليات والمشاركات</p>
            </div>
            <a href="/logout" class="text-red-600 hover:text-red-800 font-bold">Déconnexion (خروج)</a>
        </div>

        <div id="message" class="hidden mb-6 rounded-xl px-5 py-3 text-center font-bold"></div>

        <div class="bg-white rounded-2xl shadow-xl overflow-hidden mb-10">
            <div class="bg-gradient-to-r from-green-600 to-emerald-500 p-6 flex flex-wrap justify-between items-center gap-3">
                <div>
                    <h2 id="formTitle" class="text-white text-2xl font-bold">Nouvel événement</h2>
                    <p class="text-green-50 text-sm">إضافة فعالية جديدة</p>
                </div>
                <button type="button" id="annulerEdit" onclick="resetFormulaire()"
                    class="hidden bg-white/20 hover:bg-white/30 text-white font-bold px-4 py-2 rounded-lg">
                    Annuler la modification
                </button>
            </div>

            <form id="eventForm" class="p-6 md:p-8 grid md:grid-cols-2 gap-6" enctype="multipart/form-data">
                <div class="md:col-span-2">
                    <label for="titre" class="block font-semibold mb-2">Titre / العنوان *</label>
                    <input type="text" id="titre" name="titre" required minlength="3" maxlength="255" class="field" placeholder="Ex: Journée culturelle 2026">
                </div>

                <div class="md:col-span-2">
                    <label for="description" class="block font-semibold mb-2">Description / الوصف</label>
                    <textarea id="description" name="description" rows="4" class="field" placeholder="Description de l'événement..."></textarea>
                </div>

                <div>
                    <label for="lieu" class="block font-semibold mb-2">Lieu / المكان</label>
                    <input type="text" id="lieu" name="lieu" maxlength="255" class="field" placeholder="Ex: Nouakchott">
                </div>

                <div>
                    <label for="capacite" class="block font-semibold mb-2">Capacité / السعة</label>
                    <input type="number" id="capacite" name="capacite" min="1" step="1" class="field" placeholder="Laisser vide si illimitée">
                </div>

                <div>
                    <label for="dateDebut" class="block font-semibold mb-2">Date de début / تاريخ البداية *</label>
                    <input type="datetime-local" id="dateDebut" name="date_debut" required class="field">
                </div>

                <div>
                    <label for="dateFin" class="block font-semibold mb-2">Date de fin / تاريخ النهاية</label>
                    <input type="datetime-local" id="dateFin" name="date_fin" class="field">
                </div>

                <div>
                    <label for="statut" class="block font-semibold mb-2">Statut / الحالة *</label>
                    <select id="statut" name="statut" class="field" required>
                        <option value="brouillon">Brouillon / مسودة</option>
                        <option value="publie">Publié / منشور</option>
                        <option value="annule">Annulé / ملغي</option>
                    </select>
                </div>

                <div>
                    <label for="image" class="block font-semibold mb-2">Image / الصورة (facultatif)</label>
                    <input type="file" id="image" name="image" accept="image/*" class="field" onchange="aperçuImage(event)">
                    <img id="apercu" class="hidden mt-3 max-h-32 rounded-lg shadow" alt="Aperçu de l'image">
                </div>

                <div class="md:col-span-2">
                    <button type="submit" id="submitBtn"
                        class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg shadow-md transition duration-300">
                        Créer l'événement
                    </button>
                </div>
            </form>
        </div>

        <div class="bg-white rounded-2xl shadow-xl overflow-hidden mb-10">
            <div class="bg-gray-50 border-b border-gray-200 p-6 flex flex-wrap justify-between items-center gap-4">
                <div>
                    <h2 class="text-xl font-bold text-gray-800">Événements enregistrés</h2>
                    <p class="text-sm text-gray-500 mt-1">قائمة الفعاليات</p>
                </div>
                <div class="flex items-center gap-3">
                    <label for="filtreStatut" class="text-sm font-semibold text-gray-600">Filtrer :</label>
                    <select id="filtreStatut" class="field w-auto" onchange="chargerEvenements()">
                        <option value="">Tous</option>
                        <option value="brouillon">Brouillon</option>
                        <option value="publie">Publié</option>
                        <option value="annule">Annulé</option>
                    </select>
                    <button type="button" onclick="chargerEvenements()" class="text-green-700 hover:text-green-900" title="Rafraîchir">⟳</button>
                </div>
            </div>
            <div id="listeEvenements" class="p-6 space-y-4">
                <p class="text-center text-gray-500 py-8">Chargement des événements...</p>
            </div>
        </div>

        <div id="panneauRsvp" class="hidden bg-white rounded-2xl shadow-xl overflow-hidden mb-10">
            <div class="bg-green-600 p-5 flex justify-between items-center">
                <div>
                    <h2 class="text-white text-xl font-bold">Liste des RSVP</h2>
                    <p id="rsvpTitre" class="text-green-100 text-sm"></p>
                </div>
                <button type="button" onclick="fermerRsvps()" class="text-white text-xl font-bold">✕</button>
            </div>
            <div id="listeRsvp" class="p-6"></div>
        </div>

        <div class="text-center pb-6">
            <a href="/agenda.html" class="ajj-exit-link" aria-label="عرض الأجندة العمومية / Voir l'agenda public"><span aria-hidden="true">↗</span><span>عرض الأجندة العمومية / Voir l'agenda public</span></a>
        </div>
    </div>

    <script>
        let evenements = [];
        let editingId = null;

        function afficherMessage(texte, estErreur) {
            const el = document.getElementById('message');
            el.textContent = texte;
            el.className = estErreur
                ? 'mb-6 rounded-xl px-5 py-3 text-center font-bold bg-red-50 text-red-700 border border-red-200'
                : 'mb-6 rounded-xl px-5 py-3 text-center font-bold bg-green-50 text-green-700 border border-green-200';
        }

        function formatterDate(valeur) {
            if (!valeur) return '—';
            const date = new Date(valeur);
            if (Number.isNaN(date.getTime())) return escapeHtml(valeur);
            return date.toLocaleString('fr-FR', { dateStyle: 'medium', timeStyle: 'short' });
        }

        function pourInputDate(valeur) {
            if (!valeur) return '';
            const date = new Date(valeur);
            if (Number.isNaN(date.getTime())) return '';
            const pad = (nombre) => String(nombre).padStart(2, '0');
            return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate()) + 'T' + pad(date.getHours()) + ':' + pad(date.getMinutes());
        }

        function rapportStatut(statut) {
            if (statut === 'publie') return 'bg-green-100 text-green-700';
            if (statut === 'annule') return 'bg-red-100 text-red-700';
            return 'bg-gray-100 text-gray-600';
        }

        function aperçuImage(evenement) {
            const fichier = evenement.target.files[0];
            const apercu = document.getElementById('apercu');
            if (!fichier) {
                apercu.classList.add('hidden');
                return;
            }
            const lecteur = new FileReader();
            lecteur.onload = (e) => {
                apercu.src = e.target.result;
                apercu.classList.remove('hidden');
            };
            lecteur.readAsDataURL(fichier);
        }

        async function chargerEvenements() {
            const conteneur = document.getElementById('listeEvenements');
            const statut = document.getElementById('filtreStatut').value;
            const url = '/api/admin/evenements' + (statut ? '?statut=' + encodeURIComponent(statut) : '');
            try {
                const reponse = await fetch(url);
                if (reponse.redirected || reponse.status === 401) {
                    window.location.href = '/login.html';
                    return;
                }
                const donnees = await reponse.json();
                if (!reponse.ok || !donnees.success) throw new Error(donnees.message || 'Erreur');

                evenements = donnees.evenements || [];
                if (evenements.length === 0) {
                    conteneur.innerHTML = '<p class="text-center text-gray-500 py-8">Aucun événement enregistré.</p>';
                    return;
                }

                conteneur.innerHTML = evenements.map((evenement) => `
                    <div class="border border-gray-200 rounded-xl p-5 flex flex-wrap gap-4 justify-between items-start hover:shadow-md transition">
                        <div class="flex-grow">
                            <div class="flex flex-wrap items-center gap-3 mb-2">
                                <h3 class="text-lg font-bold text-gray-800">${escapeHtml(evenement.titre)}</h3>
                                <span class="text-xs font-bold px-3 py-1 rounded-full ${rapportStatut(evenement.statut)}">${escapeHtml(evenement.statut)}</span>
                            </div>
                            <p class="text-sm text-gray-600 font-inter" dir="ltr">📅 ${formatterDate(evenement.date_debut)}</p>
                            <p class="text-sm text-gray-600">📍 ${escapeHtml(evenement.lieu || '—')}</p>
                            <div class="flex flex-wrap gap-4 mt-3 text-sm">
                                <a href="#" onclick="voirRsvps('${escapeJs(evenement.id)}'); return false;" class="text-green-600 hover:text-green-800 font-bold underline">RSVP confirmés : ${escapeHtml(evenement.rsvps_oui)}</a>
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <button type="button" onclick="modifier('${escapeJs(evenement.id)}')"
                                class="bg-green-600 hover:bg-green-700 text-white font-bold px-4 py-2 rounded-lg text-sm transition">Modifier</button>
                            <button type="button" onclick="supprimer('${escapeJs(evenement.id)}')"
                                class="bg-red-600 hover:bg-red-700 text-white font-bold px-4 py-2 rounded-lg text-sm transition">Supprimer</button>
                        </div>
                    </div>
                `).join('');
            } catch (erreur) {
                conteneur.innerHTML = '<p class="text-center text-red-500 py-8">Erreur lors du chargement des événements.</p>';
            }
        }

        function resetFormulaire() {
            editingId = null;
            document.getElementById('eventForm').reset();
            document.getElementById('apercu').classList.add('hidden');
            document.getElementById('formTitle').textContent = 'Nouvel événement';
            document.getElementById('submitBtn').textContent = 'Créer l\'événement';
            document.getElementById('annulerEdit').classList.add('hidden');
        }

        function modifier(id) {
            const evenement = evenements.find((item) => String(item.id) === String(id));
            if (!evenement) return;

            editingId = evenement.id;
            document.getElementById('titre').value = evenement.titre || '';
            document.getElementById('description').value = evenement.description || '';
            document.getElementById('lieu').value = evenement.lieu || '';
            document.getElementById('capacite').value = evenement.capacite === null || evenement.capacite === undefined ? '' : evenement.capacite;
            document.getElementById('dateDebut').value = pourInputDate(evenement.date_debut);
            document.getElementById('dateFin').value = pourInputDate(evenement.date_fin);
            document.getElementById('statut').value = evenement.statut;
            document.getElementById('formTitle').textContent = 'Modifier l\'événement';
            document.getElementById('submitBtn').textContent = 'Enregistrer les modifications';
            document.getElementById('annulerEdit').classList.remove('hidden');
            afficherMessage('Vous modifiez l\'événement sélectionné.', false);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function supprimer(id) {
            if (!confirm('Supprimer définitivement cet événement et ses RSVP ?')) return;
            try {
                const reponse = await fetch('/api/evenements/' + encodeURIComponent(id), { method: 'DELETE' });
                const donnees = await reponse.json();
                if (!reponse.ok || !donnees.success) {
                    afficherMessage(donnees.message || 'Erreur lors de la suppression', true);
                    return;
                }
                afficherMessage('Événement supprimé avec succès.', false);
                if (String(editingId) === String(id)) resetFormulaire();
                chargerEvenements();
            } catch (erreur) {
                afficherMessage('Erreur réseau lors de la suppression', true);
            }
        }

        async function voirRsvps(id) {
            const evenement = evenements.find((item) => String(item.id) === String(id));
            document.getElementById('rsvpTitre').textContent = evenement ? evenement.titre : '';
            document.getElementById('listeRsvp').innerHTML = '<p class="text-center text-gray-500 py-6">Chargement des RSVP...</p>';
            document.getElementById('panneauRsvp').classList.remove('hidden');

            try {
                const reponse = await fetch('/api/evenements/' + encodeURIComponent(id) + '/rsvps');
                if (reponse.redirected || reponse.status === 401) {
                    window.location.href = '/login.html';
                    return;
                }
                const donnees = await reponse.json();
                if (!reponse.ok || !donnees.success) throw new Error(donnees.message || 'Erreur');

                const rsvps = donnees.rsvps || [];
                if (rsvps.length === 0) {
                    document.getElementById('listeRsvp').innerHTML = '<p class="text-center text-gray-500 py-6">Aucune réponse enregistrée.</p>';
                    return;
                }

                const couleur = { oui: 'bg-green-100 text-green-700', non: 'bg-red-100 text-red-700', peut_etre: 'bg-yellow-100 text-yellow-700' };
                document.getElementById('listeRsvp').innerHTML = `
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm text-right">
                            <thead class="bg-gray-50 text-gray-600">
                                <tr>
                                    <th class="p-3">Nom</th>
                                    <th class="p-3">Téléphone</th>
                                    <th class="p-3">Réponse</th>
                                    <th class="p-3">Note</th>
                                    <th class="p-3">Date</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${rsvps.map((rsvp) => `
                                    <tr class="border-t border-gray-100">
                                        <td class="p-3 font-semibold">${escapeHtml(rsvp.nom_invite || rsvp.membre_nom || '—')}</td>
                                        <td class="p-3 font-inter" dir="ltr">${escapeHtml(rsvp.telephone || '—')}</td>
                                        <td class="p-3"><span class="text-xs font-bold px-2 py-1 rounded-full ${couleur[rsvp.reponse] || 'bg-gray-100 text-gray-600'}">${escapeHtml(rsvp.reponse)}</span></td>
                                        <td class="p-3">${escapeHtml(rsvp.note || '—')}</td>
                                        <td class="p-3 font-inter">${formatterDate(rsvp.created_at)}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } catch (erreur) {
                document.getElementById('listeRsvp').innerHTML = '<p class="text-center text-red-500 py-6">Erreur lors du chargement des RSVP.</p>';
            }
        }

        function fermerRsvps() {
            document.getElementById('panneauRsvp').classList.add('hidden');
        }

        document.getElementById('eventForm').addEventListener('submit', async function (evenement) {
            evenement.preventDefault();

            const bouton = document.getElementById('submitBtn');
            bouton.disabled = true;
            bouton.textContent = 'Envoi en cours...';

            const donneesFormulaire = new FormData();
            donneesFormulaire.append('titre', document.getElementById('titre').value.trim());
            donneesFormulaire.append('description', document.getElementById('description').value.trim());
            donneesFormulaire.append('lieu', document.getElementById('lieu').value.trim());
            donneesFormulaire.append('date_debut', document.getElementById('dateDebut').value);
            donneesFormulaire.append('date_fin', document.getElementById('dateFin').value);
            donneesFormulaire.append('capacite', document.getElementById('capacite').value);
            donneesFormulaire.append('statut', document.getElementById('statut').value);

            const fichier = document.getElementById('image').files[0];
            if (fichier) donneesFormulaire.append('image', fichier);

            const url = editingId
                ? '/api/evenements/' + encodeURIComponent(editingId)
                : '/api/evenements';

            try {
                const reponse = await fetch(url, {
                    method: editingId ? 'PUT' : 'POST',
                    body: donneesFormulaire
                });
                if (reponse.redirected || reponse.status === 401) {
                    window.location.href = '/login.html';
                    return;
                }
                const resultat = await reponse.json();
                if (!reponse.ok || !resultat.success) {
                    const details = Array.isArray(resultat.errors) ? resultat.errors.join(' · ') : resultat.message;
                    afficherMessage(details || 'Erreur lors de l\'enregistrement', true);
                    return;
                }
                afficherMessage(editingId ? 'Événement mis à jour avec succès.' : 'Événement créé avec succès.', false);
                resetFormulaire();
                chargerEvenements();
            } catch (erreur) {
                afficherMessage('Erreur réseau lors de l\'enregistrement', true);
            } finally {
                bouton.disabled = false;
                bouton.textContent = editingId ? 'Enregistrer les modifications' : 'Créer l\'événement';
            }
        });

        chargerEvenements();
    </script>
</body>

</html>
