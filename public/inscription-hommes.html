<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الرجال - Inscription Hommes</title>
    <link href="/css/app.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="/js/utils.js"></script>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(-45deg, #f0fdf4, #dcfce7, #ecfdf5, #ffffff);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        .font-inter {
            font-family: 'Inter', sans-serif;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* Glassmorphism Classes */
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }

        .glass-header {
            background: linear-gradient(135deg, rgba(6, 95, 70, 0.95) 0%, rgba(16, 185, 129, 0.9) 100%);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Palette AJJ unifiée */
        :root { --ajj-emerald: #087f5b; --ajj-deep: #062c2a; --ajj-gold: #d8aa55; --ajj-sand: #e9d7b4; }
        [class*="text-ajj-emerald"] { color: var(--ajj-emerald) !important; }
        [class*="text-ajj-deep"] { color: var(--ajj-deep) !important; }
        [class*="text-ajj-gold"] { color: var(--ajj-gold) !important; }
        [class*="text-ajj-sand"] { color: var(--ajj-sand) !important; }
        [class*="text-green-"], [class*="text-emerald-"], [class*="text-teal-"],
        [class*="text-cyan-"], [class*="text-blue-"], [class*="text-indigo-"],
        [class*="text-purple-"], [class*="text-violet-"], [class*="text-fuchsia-"],
        [class*="text-amber-"], [class*="text-yellow-"], [class*="text-orange-"],
        [class*="text-pink-"], [class*="text-rose-"] { color: var(--ajj-emerald) !important; }
        [class*="text-green-50"], [class*="text-emerald-50"],
        [class*="text-amber-50"], [class*="text-yellow-50"] { color: var(--ajj-sand) !important; }
        [class*="text-gray-"], [class*="text-slate-"] { color: #425a52 !important; }
        [class*="bg-green-"], [class*="bg-emerald-"], [class*="bg-teal-"],
        [class*="bg-cyan-"], [class*="bg-blue-"], [class*="bg-indigo-"],
        [class*="bg-purple-"], [class*="bg-violet-"], [class*="bg-fuchsia-"] { background-color: var(--ajj-emerald) !important; }
        [class*="bg-amber-"], [class*="bg-yellow-"], [class*="bg-orange-"],
        [class*="bg-pink-"], [class*="bg-rose-"] { background-color: var(--ajj-gold) !important; }
        [class*="bg-green-50"], [class*="bg-emerald-50"], [class*="bg-teal-50"],
        [class*="bg-blue-50"], [class*="bg-indigo-50"], [class*="bg-purple-50"],
        [class*="bg-pink-50"], [class*="bg-rose-50"], [class*="bg-amber-50"],
        [class*="bg-yellow-50"] { background-color: rgba(8,127,91,.09) !important; }
        [class*="bg-gray-100"], [class*="bg-gray-200"], [class*="bg-gray-50"],
        [class*="bg-slate-100"], [class*="bg-slate-200"], [class*="bg-slate-50"] { background-color: #f7f2e8 !important; }
        [class*="bg-gray-800"], [class*="bg-gray-900"],
        [class*="bg-slate-800"], [class*="bg-slate-900"] { background-color: var(--ajj-deep) !important; }
        [class*="border-green-"], [class*="border-emerald-"], [class*="border-teal-"],
        [class*="border-blue-"], [class*="border-indigo-"], [class*="border-amber-"],
        [class*="border-yellow-"] { border-color: var(--ajj-emerald) !important; }
        [class*="border-pink-"], [class*="border-purple-"], [class*="border-rose-"] { border-color: var(--ajj-gold) !important; }
        [class*="border-gray-"], [class*="border-slate-"] { border-color: rgba(6,44,42,.14) !important; }
        [class*="ring-green-"], [class*="ring-emerald-"], [class*="ring-teal-"],
        [class*="ring-blue-"], [class*="ring-purple-"], [class*="ring-pink-"] { --tw-ring-color: rgba(8,127,91,.25) !important; }
        [class*="from-green-"], [class*="from-emerald-"], [class*="from-teal-"],
        [class*="from-cyan-"], [class*="from-blue-"], [class*="from-indigo-"],
        [class*="from-purple-"], [class*="from-violet-"], [class*="from-fuchsia-"],
        [class*="from-pink-"], [class*="from-rose-"] { --tw-gradient-from: var(--ajj-emerald) var(--tw-gradient-from-position) !important; }
        [class*="from-amber-"], [class*="from-yellow-"], [class*="from-orange-"] { --tw-gradient-from: var(--ajj-gold) var(--tw-gradient-from-position) !important; }
        [class*="from-gray-"], [class*="from-slate-"] { --tw-gradient-from: var(--ajj-deep) var(--tw-gradient-from-position) !important; }
        [class*="to-green-"], [class*="to-emerald-"], [class*="to-teal-"],
        [class*="to-cyan-"], [class*="to-blue-"], [class*="to-indigo-"],
        [class*="to-purple-"], [class*="to-violet-"], [class*="to-fuchsia-"],
        [class*="to-pink-"], [class*="to-rose-"] { --tw-gradient-to: var(--ajj-emerald) var(--tw-gradient-to-position) !important; }
        [class*="to-amber-"], [class*="to-yellow-"], [class*="to-orange-"] { --tw-gradient-to: var(--ajj-gold) var(--tw-gradient-to-position) !important; }
        [class*="to-gray-"], [class*="to-slate-"] { --tw-gradient-to: var(--ajj-deep) var(--tw-gradient-to-position) !important; }
        [class*="via-green-"], [class*="via-emerald-"], [class*="via-yellow-"] { --tw-gradient-via: var(--ajj-emerald) var(--tw-gradient-via-position) !important; }
</style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <a href="/" class="ajj-back ajj-back--fixed" aria-label="العودة إلى الرئيسية / Retour à l'accueil">
        <svg class="ajj-back__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        <span>العودة إلى الرئيسية</span>
        <span class="ajj-back__fr" lang="fr">Retour à l'accueil</span>
    </a>

    <div class="glass-card rounded-3xl w-full max-w-md overflow-hidden relative border-t-4 border-green-500 shadow-2xl">

        <!-- En-tête -->
        <div class="glass-header p-6 text-center relative overflow-hidden text-white">
            <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-10">
            </div>
            <h1 class="text-3xl font-extrabold font-cairo drop-shadow-md">تسجيل الرجال</h1>
            <p class="text-green-100 text-sm mt-1 font-inter opacity-90 tracking-wide">Inscription Hommes</p>
        </div>

        <div class="p-8 text-center bg-white/40">

            <h2 class="text-2xl font-black text-gray-800 mb-1 leading-relaxed font-cairo">
                سجل الآن
            </h2>
            <p class="text-sm text-gray-600 font-inter mb-6">Inscription Hommes</p>

            <form id="inscriptionForm" class="space-y-4 text-right">
                <div>
                    <label for="nom" class="block text-sm font-bold text-gray-700 mb-1">الاسم الكامل / Nom complet <span
                            class="text-red-500">*</span></label>
                    <input id="nom" name="nom" type="text" required minlength="3" maxlength="100" autocomplete="name"
                        class="w-full px-4 py-3 rounded-xl border border-gray-300 bg-white text-gray-800 focus:ring-2 focus:ring-green-500 outline-none">
                </div>
                <div>
                    <label for="telephone" class="block text-sm font-bold text-gray-700 mb-1">الهاتف / Téléphone <span
                            class="text-red-500">*</span></label>
                    <input id="telephone" name="telephone" type="tel" required pattern="[0-9]{8,15}" inputmode="numeric"
                        dir="ltr" autocomplete="tel"
                        class="w-full px-4 py-3 rounded-xl border border-gray-300 bg-white text-gray-800 font-inter text-left focus:ring-2 focus:ring-green-500 outline-none">
                </div>
                <div>
                    <label for="whatsapp" class="block text-sm font-bold text-gray-700 mb-1">واتساب / WhatsApp</label>
                    <input id="whatsapp" name="whatsapp" type="tel" dir="ltr" autocomplete="tel"
                        class="w-full px-4 py-3 rounded-xl border border-gray-300 bg-white text-gray-800 font-inter text-left focus:ring-2 focus:ring-green-500 outline-none">
                </div>
                <div>
                    <label for="email" class="block text-sm font-bold text-gray-700 mb-1">البريد الإلكتروني / Email</label>
                    <input id="email" name="email" type="email" dir="ltr" autocomplete="email"
                        class="w-full px-4 py-3 rounded-xl border border-gray-300 bg-white text-gray-800 font-inter text-left focus:ring-2 focus:ring-green-500 outline-none">
                </div>
                <label for="consentement" class="flex items-start gap-3 text-sm text-gray-700 font-cairo text-right">
                    <input id="consentement" name="consentement" type="checkbox" required
                        class="mt-1 w-5 h-5 accent-green-600 flex-shrink-0">
                    <span>أوافق على معالجة بياناتي لهذا التسجيل / J'accepte le traitement de mes données <span
                            class="text-red-500">*</span></span>
                </label>
                <button id="submitBtn" type="submit"
                    class="w-full bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white font-bold py-3 px-8 rounded-xl transition duration-300 shadow-md disabled:opacity-50">
                    إرسال التسجيل / Envoyer l'inscription
                </button>
            </form>

            <div id="formMessage" class="hidden mt-6 rounded-2xl border border-green-200 bg-white/90 p-6 shadow-inner"
                role="status"></div>
        </div>

        <div class="bg-gray-100/80 p-4 text-center text-xs text-gray-500 border-t border-gray-200/50 font-inter">
            Mauritanie &copy; 2026 - Assoc. Jeunesse
        </div>
    </div>

    <script>
        function apiMessage(data, fallback) {
            if (data && data.message) return String(data.message);
            if (data && Array.isArray(data.errors) && data.errors.length > 0) return data.errors.join(', ');
            return fallback;
        }

        const form = document.getElementById('inscriptionForm');
        const message = document.getElementById('formMessage');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            message.classList.add('hidden');
            submitBtn.disabled = true;

            const payload = {
                nom: document.getElementById('nom').value.trim(),
                telephone: document.getElementById('telephone').value.trim(),
                situation: 'نعم',
                whatsapp: document.getElementById('whatsapp').value.trim(),
                email: document.getElementById('email').value.trim(),
                consentement: document.getElementById('consentement').checked
            };

            try {
                const response = await fetch('/api/inscriptions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok || !data.success) {
                    throw new Error(apiMessage(data, 'Erreur lors de l\'inscription / خطأ أثناء التسجيل'));
                }

                const token = escapeHtml(data.token || '');
                const tokenParam = escapeHtml(encodeURIComponent(data.token || ''));
                message.innerHTML = `
                    <p class="text-lg font-extrabold text-green-700 mb-2">تم تسجيل طلبك بنجاح</p>
                    <p class="text-sm text-gray-600 font-inter mb-4">Inscription enregistrée, en attente de validation.</p>
                    <p class="text-sm text-gray-700 mb-1">رمز المتابعة / Token :</p>
                    <code class="block w-full break-all bg-gray-100 rounded-lg p-2 text-xs text-green-800 font-inter" dir="ltr">${token}</code>
                    <a href="/carte.html?token=${tokenParam}"
                        class="mt-5 inline-block w-full text-center bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white font-bold py-3 px-6 rounded-xl transition duration-300 shadow-md">
                        بطاقتي / Voir ma carte
                    </a>
                `;
                message.classList.remove('hidden');
                form.classList.add('hidden');
            } catch (error) {
                message.innerHTML = `<p class="font-bold text-red-600">${escapeHtml(error.message || 'Erreur réseau / خطأ في الشبكة')}</p>`;
                message.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
