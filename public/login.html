<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Admin - رابطة شباب جدة</title>
    <link href="/css/app.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(-45deg, #065f46, #10b981, #047857, #059669);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        .font-inter {
            font-family: 'Inter', sans-serif;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .input-modern {
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .input-modern:focus {
            background: #ffffff;
            border-color: #10b981;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
        }

        /* Palette AJJ unifiée */
        :root { --ajj-emerald: #087f5b; --ajj-deep: #062c2a; --ajj-gold: #d8aa55; --ajj-sand: #e9d7b4; }
        [class*="text-ajj-emerald"] { color: var(--ajj-emerald) !important; }
        [class*="text-ajj-deep"] { color: var(--ajj-deep) !important; }
        [class*="text-ajj-gold"] { color: var(--ajj-gold) !important; }
        [class*="text-ajj-sand"] { color: var(--ajj-sand) !important; }
        [class*="text-green-"], [class*="text-emerald-"], [class*="text-teal-"],
        [class*="text-cyan-"], [class*="text-blue-"], [class*="text-indigo-"],
        [class*="text-purple-"], [class*="text-violet-"], [class*="text-fuchsia-"],
        [class*="text-amber-"], [class*="text-yellow-"], [class*="text-orange-"],
        [class*="text-pink-"], [class*="text-rose-"] { color: var(--ajj-emerald) !important; }
        [class*="text-green-50"], [class*="text-emerald-50"],
        [class*="text-amber-50"], [class*="text-yellow-50"] { color: var(--ajj-sand) !important; }
        [class*="text-gray-"], [class*="text-slate-"] { color: #425a52 !important; }
        [class*="bg-green-"], [class*="bg-emerald-"], [class*="bg-teal-"],
        [class*="bg-cyan-"], [class*="bg-blue-"], [class*="bg-indigo-"],
        [class*="bg-purple-"], [class*="bg-violet-"], [class*="bg-fuchsia-"] { background-color: var(--ajj-emerald) !important; }
        [class*="bg-amber-"], [class*="bg-yellow-"], [class*="bg-orange-"],
        [class*="bg-pink-"], [class*="bg-rose-"] { background-color: var(--ajj-gold) !important; }
        [class*="bg-green-50"], [class*="bg-emerald-50"], [class*="bg-teal-50"],
        [class*="bg-blue-50"], [class*="bg-indigo-50"], [class*="bg-purple-50"],
        [class*="bg-pink-50"], [class*="bg-rose-50"], [class*="bg-amber-50"],
        [class*="bg-yellow-50"] { background-color: rgba(8,127,91,.09) !important; }
        [class*="bg-gray-100"], [class*="bg-gray-200"], [class*="bg-gray-50"],
        [class*="bg-slate-100"], [class*="bg-slate-200"], [class*="bg-slate-50"] { background-color: #f7f2e8 !important; }
        [class*="bg-gray-800"], [class*="bg-gray-900"],
        [class*="bg-slate-800"], [class*="bg-slate-900"] { background-color: var(--ajj-deep) !important; }
        [class*="border-green-"], [class*="border-emerald-"], [class*="border-teal-"],
        [class*="border-blue-"], [class*="border-indigo-"], [class*="border-amber-"],
        [class*="border-yellow-"] { border-color: var(--ajj-emerald) !important; }
        [class*="border-pink-"], [class*="border-purple-"], [class*="border-rose-"] { border-color: var(--ajj-gold) !important; }
        [class*="border-gray-"], [class*="border-slate-"] { border-color: rgba(6,44,42,.14) !important; }
        [class*="ring-green-"], [class*="ring-emerald-"], [class*="ring-teal-"],
        [class*="ring-blue-"], [class*="ring-purple-"], [class*="ring-pink-"] { --tw-ring-color: rgba(8,127,91,.25) !important; }
        [class*="from-green-"], [class*="from-emerald-"], [class*="from-teal-"],
        [class*="from-cyan-"], [class*="from-blue-"], [class*="from-indigo-"],
        [class*="from-purple-"], [class*="from-violet-"], [class*="from-fuchsia-"],
        [class*="from-pink-"], [class*="from-rose-"] { --tw-gradient-from: var(--ajj-emerald) var(--tw-gradient-from-position) !important; }
        [class*="from-amber-"], [class*="from-yellow-"], [class*="from-orange-"] { --tw-gradient-from: var(--ajj-gold) var(--tw-gradient-from-position) !important; }
        [class*="from-gray-"], [class*="from-slate-"] { --tw-gradient-from: var(--ajj-deep) var(--tw-gradient-from-position) !important; }
        [class*="to-green-"], [class*="to-emerald-"], [class*="to-teal-"],
        [class*="to-cyan-"], [class*="to-blue-"], [class*="to-indigo-"],
        [class*="to-purple-"], [class*="to-violet-"], [class*="to-fuchsia-"],
        [class*="to-pink-"], [class*="to-rose-"] { --tw-gradient-to: var(--ajj-emerald) var(--tw-gradient-to-position) !important; }
        [class*="to-amber-"], [class*="to-yellow-"], [class*="to-orange-"] { --tw-gradient-to: var(--ajj-gold) var(--tw-gradient-to-position) !important; }
        [class*="to-gray-"], [class*="to-slate-"] { --tw-gradient-to: var(--ajj-deep) var(--tw-gradient-to-position) !important; }
        [class*="via-green-"], [class*="via-emerald-"], [class*="via-yellow-"] { --tw-gradient-via: var(--ajj-emerald) var(--tw-gradient-via-position) !important; }
</style>
</head>

<body class="min-h-screen flex items-center justify-center p-6 md:p-10 relative overflow-y-auto">
    <!-- Decorative background elements -->
    <div
        class="absolute top-1/4 left-1/4 w-96 h-96 bg-green-400 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob">
    </div>
    <div
        class="absolute top-1/3 right-1/4 w-96 h-96 bg-emerald-300 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-2000">
    </div>
    <div
        class="absolute bottom-1/4 left-1/3 w-96 h-96 bg-green-200 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-4000">
    </div>

    <div class="glass-card p-6 md:p-10 rounded-3xl w-full max-w-md text-center relative z-10 my-6">
        <div class="mb-6">
            <div
                class="w-24 h-24 bg-gradient-to-br from-green-50 to-emerald-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-6 shadow-[inset_0_-4px_6px_rgba(0,0,0,0.1)] text-5xl transform hover:rotate-12 transition duration-500">
                🔒
            </div>
            <h1 class="text-4xl font-extrabold text-gray-800 mb-2 tracking-tight">تسجيل الدخول</h1>
            <p class="text-gray-500 font-medium font-inter tracking-wide uppercase text-sm">Gestion - Administration</p>
        </div>

        <form id="loginForm" class="space-y-6 text-right">
            <div class="relative">
                <label class="block text-gray-700 mb-2 font-bold text-sm">Nom d'utilisateur / اسم المستخدم</label>
                <div class="relative">
                    <span class="absolute inset-y-0 right-4 flex items-center text-gray-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                    </span>
                    <input type="text" id="username" required
                        class="input-modern w-full pr-12 pl-4 py-3 rounded-xl outline-none text-left font-inter font-medium text-gray-800"
                        dir="ltr" placeholder="admin">
                </div>
            </div>

            <div class="relative">
                <label class="block text-gray-700 mb-2 font-bold text-sm">Mot de passe / كلمة المرور</label>
                <div class="relative">
                    <span class="absolute inset-y-0 right-4 flex items-center text-gray-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
                            </path>
                        </svg>
                    </span>
                    <input type="password" id="password" required
                        class="input-modern w-full pr-12 pl-4 py-3 rounded-xl outline-none text-left font-inter font-medium text-gray-800"
                        dir="ltr" placeholder="••••••••">
                </div>
            </div>

            <div id="errorMsg"
                class="hidden bg-red-50 text-red-600 p-4 rounded-xl text-sm font-bold text-center border border-red-200 shadow-sm animate-pulse">
                ⚠️ Identifiants incorrects / معلومات غير صحيحة
            </div>

            <button type="submit"
                class="w-full bg-gradient-to-r from-green-600 to-emerald-500 hover:from-green-700 hover:to-emerald-600 text-white font-bold py-4 rounded-xl shadow-[0_10px_20px_rgba(16,185,129,0.3)] hover:shadow-[0_15px_25px_rgba(16,185,129,0.4)] transition-all duration-300 transform hover:-translate-y-1 text-lg">
                Dukhul / دخول
            </button>
        </form>

        <p class="mt-8 text-center text-sm text-gray-500 font-inter">
            <a href="/"
                class="hover:text-green-600 hover:underline transition font-bold flex items-center justify-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                Retour au site
            </a>
        </p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    window.location.href = data.redirect;
                } else {
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                console.error(err);
                errorMsg.innerText = "Erreur de connexion serveur";
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>

</html>
