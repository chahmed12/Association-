<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة السجل - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: linear-gradient(-45deg, #f0fdf4, #dcfce7, #ecfdf5, #ffffff); background-size: 400% 400%; }
        .font-inter { font-family: 'Inter', sans-serif; }
        .glass-card { background: rgba(255,255,255,.78); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.6); box-shadow: 0 8px 32px rgba(31,38,135,.08); }
    </style>
</head>

<body class="min-h-screen text-gray-800">
    <header class="bg-gradient-to-r from-green-700 to-emerald-500 text-white shadow-2xl">
        <div class="container mx-auto px-4 py-8 flex flex-wrap items-center justify-between gap-4">
            <div>
                <h1 class="text-3xl font-extrabold">سجل الرابطة — Gestion du journal</h1>
                <p class="text-green-50 text-sm font-inter mt-1">Modération des contributions publiques</p>
            </div>
            <div class="flex gap-3">
                <a href="/admin.html" class="bg-white/15 hover:bg-white/25 border border-white/30 rounded-full px-5 py-2 text-sm font-bold transition">لوحة التحكم — Dashboard</a>
                <a href="/logout" class="bg-red-600 hover:bg-red-700 rounded-full px-5 py-2 text-sm font-bold transition">خروج — Déconnexion</a>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-10">
        <div class="glass-card rounded-3xl p-6 md:p-8">
            <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
                <div>
                    <h2 class="text-xl font-bold">المساهمات — Contributions</h2>
                    <p class="text-gray-500 text-xs font-inter">Les messages sont publiés après validation.</p>
                </div>
                <label class="flex items-center gap-3 text-sm">
                    <span class="font-bold">الحالة — Statut</span>
                    <select id="statutFilter" class="rounded-xl border border-gray-300 px-4 py-2 bg-white">
                        <option value="">الكل — Tous</option>
                        <option value="en_attente">قيد المراجعة — En attente</option>
                        <option value="publie">منشور — Publié</option>
                        <option value="rejete">مرفوض — Rejeté</option>
                    </select>
                </label>
            </div>

            <p id="journalAdminStatus" class="text-sm text-gray-500 mb-4" role="status" aria-live="polite">جاري التحميل... — Chargement…</p>

            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="text-right border-b-2 border-green-100">
                            <th class="py-3 px-2">الاسم — Nom</th>
                            <th class="py-3 px-2">الرسالة — Message</th>
                            <th class="py-3 px-2">التاريخ — Date</th>
                            <th class="py-3 px-2">الحالة — Statut</th>
                            <th class="py-3 px-2">إجراءات — Actions</th>
                        </tr>
                    </thead>
                    <tbody id="journalRows"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const rows = document.getElementById('journalRows');
        const statusText = document.getElementById('journalAdminStatus');
        const statutFilter = document.getElementById('statutFilter');

        function toast(message, icon) {
            if (typeof Swal !== 'undefined' && Swal.mixin) {
                Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 2500 }).fire({ icon: icon || 'success', title: message });
            }
        }

        function redirectIfUnauthorized(response) {
            if (response.status === 401) {
                window.location.href = '/login.html';
                return true;
            }
            return false;
        }

        async function api(url, options) {
            const response = await fetch(url, options);
            if (redirectIfUnauthorized(response)) return null;
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.message || (data.errors && data.errors[0]) || 'HTTP ' + response.status);
            return data;
        }

        function formatDate(value) {
            if (!value) return '—';
            const date = new Date(value);
            return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleString('fr-FR');
        }

        function render(entries) {
            if (!rows) return;
            if (!entries.length) {
                rows.innerHTML = '<tr><td colspan="5" class="py-10 text-center text-gray-500">لا توجد مساهمات — Aucune contribution.</td></tr>';
                return;
            }
            rows.innerHTML = entries.map((entry) => {
                const nom = escapeHtml(entry.nom || '');
                const message = escapeHtml(entry.message || '');
                const date = escapeHtml(formatDate(entry.created_at));
                const statut = escapeHtml(entry.statut || '');
                const publier = entry.statut !== 'publie'
                    ? `<button type="button" class="bg-green-600 hover:bg-green-700 text-white rounded-lg px-3 py-1 text-xs font-bold" data-publier="${escapeHtml(String(entry.id))}">نشر — Publier</button>`
                    : '';
                return `<tr class="border-b border-gray-100 align-top">
                    <td class="py-3 px-2 font-bold">${nom}</td>
                    <td class="py-3 px-2 text-gray-600 max-w-md">${message}</td>
                    <td class="py-3 px-2 font-inter text-xs" dir="ltr">${date}</td>
                    <td class="py-3 px-2"><span class="rounded-full bg-gray-100 px-3 py-1 text-xs font-bold">${statut}</span></td>
                    <td class="py-3 px-2">
                        <div class="flex flex-wrap gap-2">
                            ${publier}
                            <button type="button" class="bg-red-600 hover:bg-red-700 text-white rounded-lg px-3 py-1 text-xs font-bold" data-supprimer="${escapeHtml(String(entry.id))}">حذف — Supprimer</button>
                        </div>
                    </td>
                </tr>`;
            }).join('');
        }

        async function load() {
            if (!statusText) return;
            statusText.textContent = 'جاري التحميل... — Chargement…';
            try {
                const statut = statutFilter ? statutFilter.value : '';
                const data = await api('/api/admin/journal' + (statut ? '?statut=' + encodeURIComponent(statut) : ''));
                if (!data) return;
                render(data.entries || []);
                statusText.textContent = 'تم التحميل — Chargé.';
            } catch (error) {
                statusText.textContent = 'تعذر التحميل — Chargement impossible : ' + error.message;
            }
        }

        async function confirmerSuppression() {
            if (typeof Swal !== 'undefined' && Swal.fire) {
                const result = await Swal.fire({
                    title: 'Supprimer cette contribution ?',
                    text: 'سيتم حذف المساهمة نهائياً.',
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#dc2626',
                    cancelButtonColor: '#6b7280',
                    confirmButtonText: 'حذف — Supprimer',
                    cancelButtonText: 'إلغاء — Annuler'
                });
                return result.isConfirmed;
            }
            return window.confirm('Supprimer cette contribution ?');
        }

        document.addEventListener('click', async (event) => {
            const publier = event.target.closest('[data-publier]');
            const supprimer = event.target.closest('[data-supprimer]');
            try {
                if (publier) {
                    await api('/api/admin/journal/' + encodeURIComponent(publier.dataset.publier), {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ statut: 'publie' })
                    });
                    toast('تم النشر — Publié', 'success');
                    await load();
                }
                if (supprimer && await confirmerSuppression()) {
                    await api('/api/admin/journal/' + encodeURIComponent(supprimer.dataset.supprimer), { method: 'DELETE' });
                    toast('تم الحذف — Supprimé', 'success');
                    await load();
                }
            } catch (error) {
                toast(error.message, 'error');
            }
        });

        if (statutFilter) statutFilter.addEventListener('change', load);
        load();
    </script>
</body>

</html>
